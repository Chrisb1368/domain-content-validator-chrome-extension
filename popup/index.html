<!DOCTYPE html>
<html lang="en">
<head>
    <title>Controller Mapper</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Map keyboard/mouse keys to the controller"
    />
    <meta name="robots" content="index,follow" />

    
    <link rel="stylesheet" type="text/css" media="screen" href="style.css">
    <script type="text/javascript" src="script.js" defer="true"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">
</head>
<body>

    <main>
        <!-- <div>
            <span>Enable Extension: </span>
        </div> -->
        <div class="dialog-box box">
            <section id="icon-sec">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="lightgreen" class="bi bi-check-circle-fill" viewBox=".1 .1 16 16">
                  <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </section>
            <section>
                <h3 id="heading">No Email Detected</h3>
                <p id="msg">You can browse freely, a notification popup will appear if something suspicious is detected.</p>
            </section>
        </div>
        <div class="info-box box hidden"></div>
    </main>
    
</body>
</html>
