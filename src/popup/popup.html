<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Domain-Content Validator</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#1f1f1f; --muted:#5f6368; --line:#e0e0e0; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#1f1f1f; --fg:#e8eaed; --muted:#9aa0a6; --line:#3c4043; }
      }
      body { width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
             font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
      .verdict { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
      .verdict[data-risk="safe"]    { border-color:#1E8E3E; }
      .verdict[data-risk="caution"] { border-color:#F9AB00; }
      .verdict[data-risk="danger"]  { border-color:#D93025; }
      .status { font-weight: 600; margin: 0 0 6px; }
      ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
      .row { display: flex; align-items: center; justify-content: space-between;
             padding: 9px 0; border-top: 1px solid var(--line); }
      label { font-size: 13px; }
      footer { margin-top: 12px; font-size: 11px; color: var(--muted); }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Domain-Content Validator</h1>
    <p class="sub">Checks that the sender's domain matches what the message claims.</p>

    <section class="verdict" id="verdict" data-risk="safe" aria-live="polite">
      <p class="status" id="status">No message analyzed yet</p>
      <ul id="reasons"></ul>
    </section>

    <div class="row">
      <label for="enabled">Protection enabled</label>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <label for="sensitivity">Sensitivity</label>
      <select id="sensitivity">
        <option value="relaxed">Relaxed</option>
        <option value="balanced">Balanced</option>
        <option value="strict">Strict</option>
      </select>
    </div>

    <footer>
      Analysis runs locally. Message content is never stored or shared.<br />
      <a href="https://www.timemotionstudy.com/private-policy" target="_blank" rel="noopener">Privacy policy</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
